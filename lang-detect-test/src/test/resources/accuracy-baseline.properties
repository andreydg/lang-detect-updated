# Regression benchmark: accuracy (%) of the production algorithm (LINEAR_WEIGHTS)
# on every non-blank line of the existing test split,
# lang-detect/war/languagemodels/trainingAndTestSet/*_test.
#
# The test lines are cut from the same source texts (modelSource) the n-gram
# models were built from, so these numbers track regressions on known text; they
# are not an estimate of accuracy on new text.
#
# ProductionAccuracyTest fails when the overall or any per-language accuracy
# drops more than `tolerance` percentage points below these values. When a
# change improves accuracy, raise them in the same change (numbers are in
# lang-detect-test/target/accuracy-report.md after a test run).
tolerance=0.10

overall=93.42
en=96.57
fr=93.58
it=92.89
de=97.82
es=88.53
pt=91.13
