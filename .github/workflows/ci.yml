name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            lang-detect-test/target/accuracy-report.md
          if-no-files-found: ignore

      - name: Publish accuracy report
        if: always()
        run: |
          report=lang-detect-test/target/accuracy-report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  ui:
    name: UI tests (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lang-detect-web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lang-detect-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test
