# Weekly dependency updates, so pinned versions (e.g. GitHub Actions running on a
# retired Node.js runtime) don't silently go stale. Minor and patch bumps are
# grouped into one PR per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /lang-detect-web
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
